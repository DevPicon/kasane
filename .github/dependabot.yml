version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      compose:
        patterns:
          - "org.jetbrains.compose"
          - "org.jetbrains.compose.*:*"
      grpc:
        patterns:
          - "io.grpc:*"
      protobuf:
        patterns:
          - "com.google.protobuf:*"
