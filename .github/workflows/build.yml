name: Build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  macos:
    name: macOS ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Validate version contract
        run: python3 scripts/check-version.py
      - name: Package application
        run: ./gradlew createDistributable --no-daemon --console=plain
      - name: Archive and checksum
        env:
          KASANE_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          version=$(sed -n 's/^appVersion=//p' gradle.properties)
          product=$(sed -n 's/^appDisplayName=//p' gradle.properties)
          mkdir -p dist
          archive="kasane-${version}-macos-${KASANE_ARCH}.zip"
          ditto -c -k --sequesterRsrc --keepParent "build/compose/binaries/main/app/$product.app" "dist/$archive"
          (cd dist && shasum -a 256 "$archive" > "$archive.sha256")
      - name: Upload macOS package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kasane-macos-${{ matrix.arch }}
          path: dist/*
          retention-days: 14
          if-no-files-found: error
