name: Tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    name: Unit and Compose tests
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Validate version contract
        run: |
          python3 scripts/test-version.py
          python3 scripts/test-signing.py
          python3 scripts/check-version.py
      - name: Test
        run: ./gradlew test --no-daemon --console=plain
      - name: Test report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-report
          path: |
            build/reports/tests/test/
            build/test-results/test/*.xml
          retention-days: 14
          if-no-files-found: warn
